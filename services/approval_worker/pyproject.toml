[tool.poetry]
name = "permit-approval-worker"
version = "0.1.0"
description = "Kafka worker for moving permits into review state."
authors = ["Codex <codex@example.com>"]
requires-poetry = ">=2.2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
aiokafka = "^0.12.0"
pydantic-settings = "^2.10.1"
greenlet = "^3.2.4"
aiosqlite = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "permit-api-service"
version = "0.1.0"
description = "API service for permit-to-work management on gas infrastructure facilities."
authors = ["zhozhyr@gmail.com"]
requires-poetry = ">=2.2.0"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.116.0"
uvicorn = { extras = ["standard"], version = "^0.35.0" }
sqlalchemy = "^2.0.43"
asyncpg = "^0.30.0"
alembic = "^1.16.0"
pydantic-settings = "^2.10.1"
aiokafka = "^0.12.0"
greenlet = "^3.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-asyncio = "^1.1.0"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api_service
          - approval_worker
          - compliance_worker
          - notification_worker

    defaults:
      run:
        shell: bash
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry==2.2.1

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install

      - name: Check import order
        run: poetry run isort --check-only src

      - name: Run flake8
        run: poetry run flake8 src --max-line-length 100

      - name: Run mypy
        run: poetry run mypy src/app

      - name: Run tests
        run: poetry run pytest -q

  build:
    name: Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api_service
            dockerfile: services/api_service/Dockerfile
          - service: approval_worker
            dockerfile: services/approval_worker/Dockerfile
          - service: compliance_worker
            dockerfile: services/compliance_worker/Dockerfile
          - service: notification_worker
            dockerfile: services/notification_worker/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: gazprom-${{ matrix.service }}:ci
